name: automerge_dart
description: >-
  Dart binding for the Automerge CRDT (Rust crate automerge 0.12.0) through
  the vendored automerge-c C API, built by a native-assets build hook.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.2.0
  hooks: ^2.2.0
  native_toolchain_rust: ^1.0.7

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.1.0
  test: ^1.33.0
