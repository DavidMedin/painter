# Pinned toolchain for building automerge-c through the automerge_dart build
# hook (package:native_toolchain_rust). The channel must be an exact version
# so builds are reproducible; it must be >= the crate's rust-version (1.90.0).
#
# Only macOS targets are listed because macOS is Painter's current target.
# Linux, Windows and Android are future targets (see the repository's
# README.md); add their Rust target triples here when they are supported.
[toolchain]
channel = "1.99.1"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
